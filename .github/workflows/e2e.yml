name: E2E

# Separate from the required checks in ci.yml. The tests drive a real desktop
# (mouse, keyboard, clipboard, WebView2), which GitHub's Windows runners provide.
# Actions are pinned to a commit SHA; the comment gives the tag it came from.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e smoke (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-driver --version 2.0.6 --locked
      - run: pnpm e2e:build
      - run: pnpm e2e:capture
      # Reports even when the capture test failed.
      - run: pnpm e2e:editor
        if: ${{ !cancelled() }}
