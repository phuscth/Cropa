# cargo-deny: licences, advisories, sources. Runs in CI.
[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Each ignore names the advisory, why it is safe for now, and when to revisit.
ignore = [
  # `paste` is archived (unmaintained, no vulnerability). It only comes in
  # through specta / tauri-specta =2.0.0-rc.28, as a proc-macro at
  # build time. Revisit when specta leaves rc or drops `paste`.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro via pinned specta rc; no fix available" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive and weak-copyleft (file-level) only. GPL/AGPL/LGPL are not allowed
# for crates; LGPL ffmpeg is an external binary, not a crate.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "BlueOak-1.0.0",
]

[licenses.private]
# Our own workspace crates (publish = false) are MIT; skip them.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
