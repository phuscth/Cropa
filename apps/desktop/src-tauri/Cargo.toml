[package]
name = "cropa-desktop"
version = "0.0.0"
description = "Cropa screenshot"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "cropa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-log = "2.10.2"
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28" }
specta-typescript = "0.0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
sys-locale = "0.3.2"
log = "0.4"
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
xcap = { version = "0.9.10", default-features = false, features = ["wgc"] }

[lints]
workspace = true
