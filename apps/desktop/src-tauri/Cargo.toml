[package]
name = "cropa-desktop"
version = "0.0.0"
description = "Cropa screenshot"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "cropa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-log = "2.10.2"
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28" }
specta-typescript = "0.0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
sys-locale = "0.3.2"
log = "0.4"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3.1"
xcap = { version = "0.9.10", default-features = false, features = ["wgc"] }
windows = { version = "0.62.2", features = [
  "Foundation_Numerics",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
